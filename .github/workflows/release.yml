name: Build FIDEX SI installer
on:
  push: { tags: ["v*"] }
  workflow_dispatch:
permissions: { contents: write }
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run prepare:win
      - run: npm run dist
      - name: Verify packaged app
        shell: pwsh
        run: |
          foreach ($f in "FIDEXSI.exe","resources\python\python.exe","resources\ollama\ollama.exe","resources\backend\app\main.py") { if (!(Test-Path "dist\win-unpacked\$f")) { throw "missing $f" } }
          & dist\win-unpacked\resources\python\python.exe -c "import sys; sys.path.insert(0,'dist/win-unpacked/resources/backend'); import app.main; print('backend import OK')"
          if (!(Test-Path dist\FIDEX-SI-Setup.exe)) { throw "installer missing" }
      - name: Silent install smoke test
        shell: pwsh
        run: |
          Start-Process dist\FIDEX-SI-Setup.exe -ArgumentList "/S" -Wait
          $d = "$env:LOCALAPPDATA\Programs\FIDEX SI"
          if (!(Test-Path "$d\FIDEXSI.exe")) { throw "not installed" }
          if (!(Test-Path "$env:USERPROFILE\Desktop\FIDEX SI.lnk")) { throw "no desktop shortcut" }
          if (!(Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\FIDEX SI.lnk")) { throw "no start menu shortcut" }
          if (!(Test-Path "$d\Uninstall FIDEX SI.exe")) { throw "no uninstaller" }
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/FIDEX-SI-Setup.exe
            dist/FIDEX-SI-Model-qwen3.5-4b.zip
      - uses: actions/upload-artifact@v4
        with:
          name: FIDEX-SI
          path: |
            dist/FIDEX-SI-Setup.exe
            dist/FIDEX-SI-Model-qwen3.5-4b.zip
